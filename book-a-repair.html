<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juvy's La Clinica</title>
    <link rel="stylesheet" href="style.css">
</head>
</body>

<header>
    <div class="logo"> Juvy's <span> La Clinica  </span></div>
    <nav> 
        <a href="index.html">Home</a>
        <a href="index.html">Services</a>
        <a href="index.html">Hours</a>
        <a href="book-a-repair.html" class="active">Book a Repair</a>
    </nav>
</header>

<main class="container">
    <section class="form container">
        <h2 class="section-title">Book a Repair</h2>
        <p style="margin-bottom: 1.5rem; color: var(--text-muted);">Fields marked * are required.</p>

        <form id="repairForm">
        <div class="form-group">
            <label for="fullname"> Full Name *</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name"    >
            </div>

        <div class="form-group">
            <label for="email"> Email Address *</label>
            <input type="email" id="email" name="email" required placeholder="Enter your email address">
        </form>

<fieldset>
        <legend>Device Type</legend>
        <div class="radio-group">
            <label>
                <input type="radio" name="device" value="Laptop" checked> Laptop
            </label>
            <label>
                <input type="radio" name="device" value="Phone"> Phone
            </label>
        </div>
    </fieldset>
    <button type="submit" class="btn-submit">Send Request</button>
</form>
    </section>
</main>

<footer>
    <p> &copy; 2024 Juvy's La Clinica. All rights reserved. </p>
</footer>
</body>
</html>
